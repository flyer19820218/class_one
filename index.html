<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>一班線上成績查詢系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        * { max-width: 100%; box-sizing: border-box; }
        .chart-container { position: relative; width: 100%; height: 350px; }
        @media (max-width: 640px) { .chart-container { height: 260px; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="login-section" class="flex items-center justify-center min-h-screen px-3 md:px-4 py-6">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl max-w-sm w-full border border-slate-100 animate-fade-in">
            <div class="text-center mb-6 md:mb-7">
                <div class="inline-flex items-center justify-center w-12 h-12 md:w-14 md:h-14 bg-indigo-50 text-indigo-600 rounded-2xl text-xl md:text-2xl mb-3 md:mb-4">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 class="text-lg md:text-xl font-black text-slate-900">一班線上成績查詢系統</h2>
                <p class="text-slate-500 text-[11px] md:text-xs mt-1 px-2 font-medium">請選擇身分並登入系統</p>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-center py-2.5 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 text-sm font-bold transition">
                        <input type="radio" name="role" value="student" checked class="sr-only" onchange="toggleRoleInput()"> 👨‍🎓 學生與家長
                    </label>
                    <label class="flex items-center justify-center py-2.5 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 text-sm font-bold transition">
                        <input type="radio" name="role" value="teacher" class="sr-only" onchange="toggleRoleInput()"> 👨‍🏫 導師專屬
                    </label>
                </div>

                <div>
                    <label id="username-label" class="block text-[11px] md:text-xs font-bold text-slate-400 mb-1 md:mb-1.5 ml-1">座號：</label>
                    <input type="text" id="username" placeholder="例如：5" class="w-full px-3 py-2.5 md:py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-[11px] md:text-xs font-bold text-slate-400 mb-1 md:mb-1.5 ml-1">身份證字號：</label>
                    <input type="password" id="password" placeholder="請注意大寫字母" class="w-full px-3 py-2.5 md:py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm font-medium">
                </div>

                <button onclick="handleLogin()" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 md:py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/10 text-sm mt-1 md:mt-2 flex items-center justify-center gap-2">
                    <span>🚀 登入系統</span>
                </button>
                <p id="login-error" class="text-red-500 text-xs text-center hidden font-bold"></p>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-5xl mx-auto px-2 py-3 sm:px-4 sm:py-6 animate-fade-in">
        <header class="bg-white p-3 sm:p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-2 mb-3 md:mb-4">
            <div class="flex items-center gap-2.5 md:gap-3">
                <div class="w-9 h-9 md:w-10 md:h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center text-base md:text-lg shadow-md shadow-indigo-600/20">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-sm md:text-lg font-black text-slate-900 leading-tight">一班線上成績查詢系統</h1>
                    <p id="user-badge-text" class="text-slate-400 text-[10px] md:text-xs font-bold text-indigo-600 mt-0.5">載入中...</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-slate-300 hover:text-red-500 transition p-1.5 md:p-2 text-lg md:text-xl">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </header>

        <div class="flex bg-slate-200/50 p-1 rounded-xl mb-3 md:mb-4 gap-1">
            <button id="tab-btn-1" onclick="switchTab(1)" class="flex-1 py-2 md:py-2.5 rounded-lg font-bold text-[11px] md:text-xs transition bg-white shadow-sm text-indigo-600">
                <i class="fa-solid fa-magnifying-glass mr-1 md:mr-1.5"></i> 單次成績報告
            </button>
            <button id="tab-btn-2" onclick="switchTab(2)" class="flex-1 py-2 md:py-2.5 rounded-lg font-bold text-[11px] md:text-xs transition text-slate-500">
                <i class="fa-solid fa-chart-line mr-1 md:mr-1.5"></i> 跨學期分析
            </button>
        </div>

        <div class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2 md:space-y-3 mb-3 md:mb-4">
            <div id="teacher-seat-picker" class="hidden border-b border-slate-50 pb-2 md:pb-3">
                <label class="block text-[9px] md:text-[10px] font-bold text-slate-400 uppercase mb-1 md:mb-1.5 ml-1">🔢 選擇查詢座號：</label>
                <select id="seat-select" onchange="onFilterChange()" class="w-full bg-slate-50 border border-slate-200 rounded-lg md:rounded-xl px-3 md:px-4 py-2 md:py-2.5 text-[13px] md:text-sm font-bold text-slate-700"></select>
            </div>
            <div>
                <label class="block text-[9px] md:text-[10px] font-bold text-slate-400 uppercase mb-1 md:mb-1.5 ml-1">📅 選擇考試項目：</label>
                <select id="exam-select" onchange="onFilterChange()" class="w-full bg-slate-50 border border-slate-200 rounded-lg md:rounded-xl px-3 md:px-4 py-2 md:py-2.5 text-[13px] md:text-sm font-bold text-slate-700"></select>
            </div>
        </div>

        <div id="global-loader" class="text-center py-8 hidden">
            <div class="inline-block animate-spin rounded-full h-5 w-5 border-4 border-indigo-600 border-t-transparent mb-2"></div>
            <p class="text-slate-400 text-[11px] font-medium">系統分析中...</p>
        </div>

        <div id="tab-content-1" class="hidden space-y-3 md:space-y-4">
            <div class="grid grid-cols-3 gap-2 md:gap-4">
                <div class="bg-white py-3 md:p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-[9px] md:text-xs font-bold text-slate-400 mb-0.5 md:mb-1 uppercase tracking-wider">五科總分</p>
                    <p id="metric-total-score" class="text-lg md:text-2xl font-black text-indigo-600">--</p>
                </div>
                <div class="bg-white py-3 md:p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-[9px] md:text-xs font-bold text-slate-400 mb-0.5 md:mb-1 uppercase tracking-wider">班級名次</p>
                    <p id="metric-rank" class="text-lg md:text-2xl font-black text-slate-800">--</p>
                </div>
                <div class="bg-white py-3 md:p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-[9px] md:text-xs font-bold text-slate-400 mb-0.5 md:mb-1 uppercase tracking-wider">總 PR</p>
                    <p id="metric-pr" class="text-lg md:text-2xl font-black text-emerald-600">--</p>
                </div>
            </div>

            <div class="flex flex-col lg:flex-row gap-3 md:gap-4">
                <div class="flex-1 bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-xs md:text-sm font-bold text-slate-900 mb-3 md:mb-4"><i class="fa-solid fa-list-check text-indigo-500 mr-1.5 md:mr-2"></i>成績明細與指標</h3>
                    <div id="score-details-list" class="space-y-1.5 md:space-y-2 text-[11px] md:text-sm font-medium text-slate-600"></div>
                </div>
                <div class="flex-1 bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                    <h3 class="text-xs md:text-sm font-bold text-slate-900 mb-1 md:mb-2 self-start"><i class="fa-solid fa-bullseye text-indigo-500 mr-1.5 md:mr-2"></i>能力核心雷達圖</h3>
                    <div class="w-full max-w-[260px] md:max-w-[320px] aspect-square relative">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-content-2" class="hidden space-y-3 md:space-y-4">
            <div class="bg-white p-3.5 md:p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[11px] md:text-sm font-bold text-slate-900 mb-3 md:mb-4 flex items-center gap-1.5 md:gap-2">
                    <i class="fa-solid fa-chart-line text-indigo-500"></i> 全學期各科 PR 值走勢圖
                </h3>
                <div class="chart-container"><canvas id="historyPrChart"></canvas></div>
            </div>
            <div class="bg-white p-3.5 md:p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[11px] md:text-sm font-bold text-orange-500 mb-3 md:mb-4 flex items-center gap-1.5 md:gap-2 uppercase tracking-wider">
                    <i class="fa-solid fa-arrow-trend-up"></i> 🏆 班級名次晉升軌跡
                </h3>
                <div class="chart-container"><canvas id="historyRankChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 全域變數與系統設定 ---
        const API_URL = "https://script.google.com/macros/s/AKfycbyEIoXhHnX3S-JQw_CQp4eWFsbPGsKkHFBsCg9xVsW499n2MgXJaHvpiyV9XYtsECzsaA/exec";
        const MASTER_MENU_URL = "https://docs.google.com/spreadsheets/d/1FL-orK8H_oDrLuDg1pAijJICjHzPxJLcPIEngF0wko8/export?format=csv&gid=0";

        let sessionState = { loggedIn: false, role: null, userId: null };
        let cachedMenuData = [];
        let allExamsData = {}; 
        let charts = { radar: null, historyPr: null, historyRank: null };

        // --- 2. 登入與權限管理 ---
        function toggleRoleInput() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const label = document.getElementById("username-label");
            const input = document.getElementById("username");
            if (role === "teacher") { label.innerText = "導師帳號："; input.placeholder = "請輸入導師帳號"; }
            else { label.innerText = "座號："; input.placeholder = "例如：5"; }
        }

        async function handleLogin() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const userId = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorEl = document.getElementById("login-error");
            const btn = document.getElementById("login-btn");

            errorEl.classList.add("hidden");
            if (!userId || !password) { errorEl.innerText = "❌ 帳號與密碼欄位不能為空！"; errorEl.classList.remove("hidden"); return; }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>正在登入中...</span>`;

            try {
                const resp = await fetch(`${API_URL}?role=${role}&userId=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`);
                const result = await resp.json();

                if (result.status === "success") {
                    sessionState.loggedIn = true; sessionState.role = result.role; sessionState.userId = role === "teacher" ? "yen" : parseInt(userId);
                    document.getElementById("login-section").classList.add("hidden");
                    document.getElementById("dashboard-section").classList.remove("hidden");
                    initDashboard();
                } else { errorEl.innerText = "❌ " + result.message; errorEl.classList.remove("hidden"); }
            } catch (err) { errorEl.innerText = "❌ 無法連線至驗證伺服器。"; errorEl.classList.remove("hidden"); }
            finally { btn.disabled = false; btn.innerHTML = `<span>🚀 登入系統</span>`; }
        }

        function handleLogout() { location.reload(); }

        // --- 3. UI 切換與輔助工具 ---
        function switchTab(tabNum) {
            const t1Btn = document.getElementById("tab-btn-1"); const t2Btn = document.getElementById("tab-btn-2");
            const t1Content = document.getElementById("tab-content-1"); const t2Content = document.getElementById("tab-content-2");

            if (tabNum === 1) {
                t1Btn.className = "flex-1 py-2 md:py-2.5 rounded-lg font-bold text-[11px] md:text-xs transition bg-white shadow-sm text-indigo-600";
                t2Btn.className = "flex-1 py-2 md:py-2.5 rounded-lg font-bold text-[11px] md:text-xs transition text-slate-500";
                t1Content.classList.remove("hidden"); t2Content.classList.add("hidden");
            } else {
                t2Btn.className = "flex-1 py-2 md:py-2.5 rounded-lg font-bold text-[11px] md:text-xs transition bg-white shadow-sm text-indigo-600";
                t1Btn.className = "flex-1 py-2 md:py-2.5 rounded-lg font-bold text-[11px] md:text-xs transition text-slate-500";
                t2Content.classList.remove("hidden"); t1Content.classList.add("hidden");
                renderHistoryCharts(); 
            }
        }

        function cleanGoogleSheetUrl(url) {
            if (url.includes("export?format=csv")) return url;
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match) {
                const gidMatch = url.match(/gid=([0-9]+)/);
                const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : "";
                return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv${gidParam}`;
            }
            return url;
        }

        function parseCSVText(text) {
            const lines = text.split(/\r?\n/);
            return lines.map(line => {
                let result = [], current = '', inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                    else { current += char; }
                }
                result.push(current.trim()); return result;
            }).filter(row => row.length > 0 && row.some(cell => cell !== ""));
        }

        // --- 4. 核心數據載入與解析 ---
        async function initDashboard() {
            document.getElementById("global-loader").classList.remove("hidden");
            document.getElementById("user-badge-text").innerText = "資料同步中...";

            try {
                const resp = await fetch(MASTER_MENU_URL);
                const csvText = await resp.text();
                const rows = parseCSVText(csvText);
                
                const headers = rows[0];
                cachedMenuData = rows.slice(1).map(row => {
                    let obj = {}; headers.forEach((h, i) => obj[h] = row[i]); return obj;
                });

                const examSelect = document.getElementById("exam-select");
                examSelect.innerHTML = "";
                cachedMenuData.forEach(item => {
                    const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                    if (name) { let opt = document.createElement("option"); opt.value = name; opt.innerText = name; examSelect.appendChild(opt); }
                });

                if (sessionState.role === "teacher") {
                    document.getElementById("teacher-seat-picker").classList.remove("hidden");
                    const seatSelect = document.getElementById("seat-select");
                    seatSelect.innerHTML = "";
                    for (let i = 1; i <= 31; i++) {
                        let opt = document.createElement("option"); opt.value = i; opt.innerText = `${i} 號`; seatSelect.appendChild(opt);
                    }
                }

                await preloadAllExams();
                onFilterChange();

            } catch (err) { alert("無法讀取總表資料！"); }
            finally { document.getElementById("global-loader").classList.add("hidden"); }
        }

        async function preloadAllExams() {
            for (let item of cachedMenuData) {
                const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                const url = item['該次成績單的 Google 試算表網址'];
                if (name && url && !allExamsData[name]) {
                    try {
                        const csvUrl = cleanGoogleSheetUrl(url);
                        const resp = await fetch(csvUrl);
                        const txt = await resp.text();
                        allExamsData[name] = processSingleExamData(txt, name);
                    } catch (e) {}
                }
            }
        }

        function processSingleExamData(csvText, examName) {
            const rows = parseCSVText(csvText);
            const headers = rows[0];
            const rawRecords = rows.slice(1).map(row => {
                let obj = {}; headers.forEach((h, i) => obj[h] = row[i]); return obj;
            });

            let students = [], stats = {};
            rawRecords.forEach(r => {
                const seatVal = parseInt(r['座號']);
                if (!isNaN(seatVal) && seatVal > 0) students.push(r);
                else {
                    const fullRowText = Object.values(r).join(" ");
                    if (fullRowText.includes('高標')) stats['高標'] = r;
                    if (fullRowText.includes('平均') || fullRowText.includes('均標')) stats['平均'] = r;
                }
            });

            let hasSoc3 = students.some(s => parseFloat(s['歷史']) > 0 || parseFloat(s['地理']) > 0 || parseFloat(s['公民']) > 0);
            const isGrade23 = hasSoc3;

            students.forEach(s => {
                ['國文', '英文', '數學', '自然', '社會', '歷史', '地理', '公民'].forEach(sub => s[sub] = parseFloat(s[sub]) || 0);
                s['社會_融合'] = isGrade23 ? (((s['歷史'] || 0) + (s['地理'] || 0) + (s['公民'] || 0)) / 3) : (s['社會'] || 0);
                s['總分'] = s['國文'] + s['英文'] + s['數學'] + s['自然'] + s['社會_融合'];
            });

            students.forEach(s => s['名次'] = 1 + students.filter(other => other['總分'] > s['總分']).length);

            const radarSubs = isGrade23 ? ['國文', '英文', '數學', '自然', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            students.forEach(s => {
                let lowerT = students.filter(other => other['總分'] < s['總分']).length, equalT = students.filter(other => other['總分'] === s['總分']).length;
                s['總PR'] = ((lowerT + 1 + (equalT - 1) / 2) / students.length) * 100;
                radarSubs.forEach(sub => {
                    let lowerS = students.filter(other => other[sub] < s[sub]).length, equalS = students.filter(other => other[sub] === s[sub]).length;
                    s[`${sub}_PR`] = ((lowerS + 1 + (equalS - 1) / 2) / students.length) * 100;
                });
            });

            return { students, stats, isGrade23 };
        }

        // --- 加入動態姓名的關鍵函數 ---
        function onFilterChange() {
            const selectedExam = document.getElementById("exam-select").value;
            const currentSeat = sessionState.role === "teacher" ? parseInt(document.getElementById("seat-select").value) : sessionState.userId;
            const examPackage = allExamsData[selectedExam];
            if (!examPackage) return;
            const student = examPackage.students.find(s => parseInt(s['座號']) === currentSeat);
            if (!student) { document.getElementById("tab-content-1").classList.add("hidden"); return; }
            
            // ⭐ 這裡會抓取該名學生的名字，並更新到右上角的 Badge
            const studentName = student['姓名'] || "";
            const badgeText = sessionState.role === "teacher" 
                ? `導師視角：${currentSeat}號 ${studentName}`
                : `${currentSeat}號 ${studentName} 的成績報告`;
            document.getElementById("user-badge-text").innerText = badgeText;

            document.getElementById("tab-content-1").classList.remove("hidden");
            renderSingleExamView(student, examPackage);
            if (!document.getElementById("tab-content-2").classList.contains("hidden")) renderHistoryCharts();
        }

        // --- 5. 繪圖渲染 (單次成績與雷達圖) ---
        function renderSingleExamView(student, examPackage) {
            document.getElementById("metric-total-score").innerText = student['總分'].toFixed(1);
            document.getElementById("metric-rank").innerText = `第 ${student['名次']}`;
            document.getElementById("metric-pr").innerText = student['總PR'].toFixed(1);

            const listEl = document.getElementById("score-details-list"); listEl.innerHTML = "";
            const isGrade23 = examPackage.isGrade23;
            const displaySubs = isGrade23 ? ['國文', '英文', '數學', '自然', '社會', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            
            displaySubs.forEach(sub => {
                const score = student[sub] || 0, avg = parseFloat(examPackage.stats['平均']?.[sub]) || 0, high = parseFloat(examPackage.stats['高標']?.[sub]) || 0;
                let row = document.createElement("div"); row.className = "flex items-center justify-between py-1.5 md:py-2 border-b border-slate-100 last:border-0";
                const prefix = ['歷史', '地理', '公民'].includes(sub) ? "└ " : "";
                
                row.innerHTML = `
                    <span>${prefix}${sub}</span>
                    <span class="font-mono text-slate-500">
                        <span class="text-indigo-600 font-bold text-[13px] md:text-base mr-0.5 md:mr-1">${score.toFixed(1)}</span>
                        <span class="hidden md:inline">分</span>
                        <span class="text-slate-300 mx-0.5 md:mx-1">|</span>
                        <span class="text-[10px] md:text-xs">均:${avg.toFixed(1)}</span>
                        <span class="text-slate-300 mx-0.5 md:mx-1">|</span>
                        <span class="text-[10px] md:text-xs">高:${high.toFixed(1)}</span>
                    </span>`;
                listEl.appendChild(row);
            });

            const radarSubs = isGrade23 ? ['國文', '英文', '數學', '自然', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            const prValues = radarSubs.map(sub => student[`${sub}_PR`] || 0);

            const isMobile = window.innerWidth <= 640;
            const radarFontSize = isMobile ? 10 : 12;

            if (charts.radar) charts.radar.destroy();
            const ctx = document.getElementById('radarChart').getContext('2d');
            charts.radar = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: radarSubs.map(s => `${s}`),
                    datasets: [{
                        label: '個人表現',
                        data: prValues,
                        backgroundColor: 'rgba(79, 129, 189, 0.35)', 
                        borderColor: 'rgba(79, 129, 189, 1)', 
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(79, 129, 189, 1)',
                        pointBorderColor: '#fff',
                        pointRadius: isMobile ? 3 : 4, 
                        pointHitRadius: 10,
                    }, {
                        label: 'PR 50',
                        data: Array(radarSubs.length).fill(50),
                        backgroundColor: 'transparent',
                        borderColor: 'rgba(192, 80, 77, 0.8)', 
                        borderWidth: 1.5,
                        borderDash: [4, 4],
                        pointRadius: 0, fill: false, 
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0, max: 100,
                            grid: { circular: true, color: 'rgba(200, 200, 200, 0.5)' },
                            angleLines: { color: 'rgba(200, 200, 200, 0.5)' },
                            pointLabels: { font: { size: radarFontSize, weight: 'bold' }, color: '#333' },
                            ticks: { display: false, stepSize: 25 },
                        }
                    },
                    plugins: { legend: { display: false }, tooltip: { cornerRadius: 6 } }
                }
            });
        }

        // --- 6. 繪圖渲染 (歷史軌跡走勢) ---
        function renderHistoryCharts() {
            const currentSeat = sessionState.role === "teacher" ? parseInt(document.getElementById("seat-select").value) : sessionState.userId;
            let labels = [], dataSets = { 國文:[], 英文:[], 數學:[], 自然:[], 社會融合:[] }, rankData = [];

            cachedMenuData.forEach(item => {
                const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                const pkg = allExamsData[name];
                if (pkg) {
                    const stud = pkg.students.find(s => parseInt(s['座號']) === currentSeat);
                    if (stud) {
                        labels.push(name.replace("年級",""));
                        dataSets.國文.push(stud['國文_PR']); dataSets.英文.push(stud['英文_PR']);
                        dataSets.數學.push(stud['數學_PR']); dataSets.自然.push(stud['自然_PR']);
                        dataSets.社會融合.push(pkg.isGrade23 ? (stud['歷史_PR'] + stud['地理_PR'] + stud['公民_PR'])/3 : stud['社會_PR']);
                        rankData.push(stud['名次']);
                    }
                }
            });

            const isMobile = window.innerWidth <= 640;
            const chartFontSize = isMobile ? 9 : 11;
            const pointRad = isMobile ? 3 : 4;

            if (charts.historyPr) charts.historyPr.destroy();
            const ctxPr = document.getElementById('historyPrChart').getContext('2d');
            charts.historyPr = new Chart(ctxPr, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '國文', data: dataSets.國文, borderColor: '#4f81bd' },
                        { label: '英文', data: dataSets.英文, borderColor: '#c0504d' },
                        { label: '數學', data: dataSets.數學, borderColor: '#9bbb59' },
                        { label: '自然', data: dataSets.自然, borderColor: '#8064a2' },
                        { label: '社會', data: dataSets.社會融合, borderColor: '#4bacc6', borderWidth: 2.5 }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { y: { min: 0, max: 100, ticks: { font: { size: chartFontSize } } }, x: { ticks: { font: { size: chartFontSize }, maxRotation: 15 } } },
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: chartFontSize } } } },
                    elements: { line: { borderWidth: 2, tension: 0.1 }, point: { radius: pointRad } }
                }
            });

            if (charts.historyRank) charts.historyRank.destroy();
            const ctxRank = document.getElementById('historyRankChart').getContext('2d');
            const maxRankFound = Math.max(...rankData, 30);
            
            charts.historyRank = new Chart(ctxRank, {
                type: 'line',
                data: { labels: labels, datasets: [{ data: rankData, borderColor: '#E67E22', backgroundColor: 'rgba(230, 126, 34, 0.1)', fill: true }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { y: { reverse: true, min: 1, max: maxRankFound + 2, ticks: { font: { size: chartFontSize }, stepSize: 5 } }, x: { ticks: { font: { size: chartFontSize }, maxRotation: 15 } } }, 
                    plugins: { legend: { display: false } },
                    elements: { line: { borderWidth: 2.5, tension: 0.1 }, point: { radius: pointRad+1, backgroundColor: '#E67E22' } }
                }
            });
        }
    </script>
</body>
</html>
