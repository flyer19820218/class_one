<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>801 專屬成績大數據主控台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-100 animate-fade-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl text-3xl mb-4">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">801 成績主控台</h2>
                <p class="text-slate-500 text-sm mt-1">請選擇身分並輸入憑證登入</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">身分身分：</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="flex items-center justify-center py-2.5 px-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 peer-checked:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 font-medium text-sm">
                            <input type="radio" name="role" value="student" checked class="sr-only" onchange="toggleRoleInput()"> 學生
                        </label>
                        <label class="flex items-center justify-center py-2.5 px-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 font-medium text-sm">
                            <input type="radio" name="role" value="parent" class="sr-only" onchange="toggleRoleInput()"> 家長
                        </label>
                        <label class="flex items-center justify-center py-2.5 px-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 font-medium text-sm">
                            <input type="radio" name="role" value="teacher" class="sr-only" onchange="toggleRoleInput()"> 導師
                        </label>
                    </div>
                </div>

                <div>
                    <label id="username-label" class="block text-sm font-semibold text-slate-700 mb-1.5">請輸入座號：</label>
                    <input type="text" id="username" placeholder="例如：5" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">請輸入密碼：</label>
                    <input type="password" id="password" placeholder="請輸入身分證字號" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition text-sm">
                </div>

                <button onclick="handleLogin()" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/10 text-sm mt-2 flex items-center justify-center gap-2">
                    <span>🚀 登入系統</span>
                </button>
                <p id="login-error" class="text-red-500 text-xs text-center hidden font-medium"></p>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-6xl mx-auto px-4 py-6 animate-fade-in">
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center text-xl shadow-md shadow-indigo-600/20">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">801 專屬成績大數據主控台</h1>
                    <p class="text-slate-400 text-xs mt-0.5">永不休眠精密分析系統</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-badge" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-circle-user text-indigo-500"></i> <span id="user-badge-text">載入中...</span>
                </span>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-red-500 transition p-2 text-lg">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <div class="flex border-b border-slate-200 mb-6 gap-2">
            <button id="tab-btn-1" onclick="switchTab(1)" class="py-3 px-6 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 transition flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> 單次段考詳細成績
            </button>
            <button id="tab-btn-2" onclick="switchTab(2)" class="py-3 px-6 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> 歷史軌跡動態分析
            </button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">📅 請選擇要查看的考試項目：</label>
                <select id="exam-select" onchange="onFilterChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm font-medium text-slate-700"></select>
            </div>
            <div id="teacher-seat-picker" class="hidden">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">🔢 請選擇要查詢的座號：</label>
                <select id="seat-select" onchange="onFilterChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm font-medium text-slate-700"></select>
            </div>
        </div>

        <div id="global-loader" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-3"></div>
            <p class="text-slate-500 text-sm font-medium">正在由 Google 雲端安全讀取最新大數據...</p>
        </div>

        <div id="tab-content-1" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-6 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-table-list text-indigo-500"></i> 各科成績與班級指標
                    </h3>
                    <div id="score-details-list" class="space-y-2 text-sm font-medium text-slate-600">
                        </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
                        <p class="text-xs font-bold text-slate-400 mb-1">五科總分</p>
                        <p id="metric-total-score" class="text-2xl font-black text-indigo-600">--</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
                        <p class="text-xs font-bold text-slate-400 mb-1">班級名次</p>
                        <p id="metric-rank" class="text-2xl font-black text-slate-800">--</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
                        <p class="text-xs font-bold text-slate-400 mb-1">總分 PR 值</p>
                        <p id="metric-pr" class="text-2xl font-black text-emerald-600">--</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                <h3 class="text-base font-bold text-slate-900 mb-4 self-start flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-500"></i> 個人能力核心雷達圖
                </h3>
                <div class="w-full max-w-sm aspect-square relative">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>

        <div id="tab-content-2" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-area text-indigo-500"></i> 各科 PR 值走勢圖 (跨學期真實能力追蹤)
                </h3>
                <div class="w-full h-80">
                    <canvas id="historyPrChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-arrow-trend-up text-orange-500"></i> 個人班級名次晉升軌跡 (曲線往上代表進步)
                </h3>
                <div class="w-full h-72">
                    <canvas id="historyRankChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 配置區：填入老師的 Google Apps Script 與 總表網址
        const API_URL = "https://script.google.com/macros/s/AKfycbyEIoXhHnX3S-JQw_CQp4eWFsbPGsKkHFBsCg9xVsW499n2MgXJaHvpiyV9XYtsECzsaA/exec";
        const MASTER_MENU_URL = "https://docs.google.com/spreadsheets/d/1FL-orK8H_oDrLuDg1pAijJICjHzPxJLcPIEngF0wko8/export?format=csv&gid=0";

        // 全局變數暫存狀態
        let sessionState = { loggedIn: false, role: null, userId: null };
        let cachedMenuData = [];
        let allExamsData = {}; // 快取所有加載過的段考資料清單
        let charts = { radar: null, historyPr: null, historyRank: null };

        // 身分切換 UI 調整
        function toggleRoleInput() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const label = document.getElementById("username-label");
            const input = document.getElementById("username");
            if (role === "teacher") {
                label.innerText = "導師帳號：";
                input.placeholder = "請輸入導師帳號";
            } else {
                label.innerText = "請輸入座號：";
                input.placeholder = "例如：5";
            }
        }

        // 登入處理
        async function handleLogin() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const userId = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorEl = document.getElementById("login-error");
            const btn = document.getElementById("login-btn");

            errorEl.classList.add("hidden");
            if (!userId || !password) {
                errorEl.innerText = "❌ 帳號與密碼欄位不能為空！";
                errorEl.classList.remove("hidden");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div> <span>正在安全驗證中...</span>`;

            try {
                // 發出安全請求給守門員
                const resp = await fetch(`${API_URL}?role=${role}&userId=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`);
                const result = await resp.json();

                if (result.status === "success") {
                    sessionState.loggedIn = true;
                    sessionState.role = result.role;
                    sessionState.userId = role === "teacher" ? "yen" : parseInt(userId);
                    
                    document.getElementById("login-section").classList.add("hidden");
                    document.getElementById("dashboard-section").classList.remove("hidden");
                    
                    initDashboard();
                } else {
                    errorEl.innerText = "❌ " + result.message;
                    errorEl.classList.remove("hidden");
                }
            } catch (err) {
                errorEl.innerText = "❌ 無法連線至驗證伺服器，請檢查網路環境。";
                errorEl.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>🚀 登入系統</span>`;
            }
        }

        // 登出處理
        function handleLogout() {
            sessionState = { loggedIn: false, role: null, userId: null };
            document.getElementById("dashboard-section").classList.add("hidden");
            document.getElementById("login-section").classList.remove("hidden");
            document.getElementById("password").value = "";
        }

        // 分頁切換
        function switchTab(tabNum) {
            const t1Btn = document.getElementById("tab-btn-1");
            const t2Btn = document.getElementById("tab-btn-2");
            const t1Content = document.getElementById("tab-content-1");
            const t2Content = document.getElementById("tab-content-2");

            if (tabNum === 1) {
                t1Btn.className = "py-3 px-6 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 transition flex items-center gap-2";
                t2Btn.className = "py-3 px-6 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition flex items-center gap-2";
                t1Content.classList.remove("hidden");
                t2Content.classList.add("hidden");
            } else {
                t2Btn.className = "py-3 px-6 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 transition flex items-center gap-2";
                t1Btn.className = "py-3 px-6 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition flex items-center gap-2";
                t2Content.classList.remove("hidden");
                t1Content.classList.add("hidden");
                renderHistoryCharts();
            }
        }

        // 轉換 Google Sheet 網址為 CSV 下載網址
        function cleanGoogleSheetUrl(url) {
            if (url.includes("export?format=csv")) return url;
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match) {
                const gidMatch = url.match(/gid=([0-9]+)/);
                const gidParam = gidMatch ? `&gid=${gidMatch.group(1)}` : "";
                return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv${gidParam}`;
            }
            return url;
        }

        // 解析 CSV 文本演算法
        function parseCSVText(text) {
            const lines = text.split(/\r?\n/);
            return lines.map(line => {
                let result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                    else { current += char; }
                }
                result.push(current.trim());
                return result;
            }).filter(row => row.length > 0 && row.some(cell => cell !== ""));
        }

        // 初始化主控面板
        async function initDashboard() {
            document.getElementById("global-loader").classList.remove("hidden");
            const badgeText = sessionState.role === "teacher" ? "導師 (yen)" : `${sessionState.role === "student" ? "學生" : "家長"} (${sessionState.userId}號)`;
            document.getElementById("user-badge-text").innerText = badgeText;

            try {
                // 1. 讀取總表清單
                const resp = await fetch(MASTER_MENU_URL);
                const csvText = await resp.text();
                const rows = parseCSVText(csvText);
                
                // 讀取標題列並建構 JSON 物件清單
                const headers = rows[0];
                cachedMenuData = rows.slice(1).map(row => {
                    let obj = {};
                    headers.forEach((h, i) => obj[h] = row[i]);
                    return obj;
                });

                // 2. 填充段考下拉選單
                const examSelect = document.getElementById("exam-select");
                examSelect.innerHTML = "";
                cachedMenuData.forEach(item => {
                    const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                    if (name) {
                        let opt = document.createElement("option");
                        opt.value = name;
                        opt.innerText = name;
                        examSelect.appendChild(opt);
                    }
                });

                // 3. 如果是導師，開啟並填充學生座號選單
                if (sessionState.role === "teacher") {
                    document.getElementById("teacher-seat-picker").classList.remove("hidden");
                    const seatSelect = document.getElementById("seat-select");
                    seatSelect.innerHTML = "";
                    for (let i = 1; i <= 31; i++) {
                        let opt = document.createElement("option");
                        opt.value = i;
                        opt.innerText = `${i} 號`;
                        seatSelect.appendChild(opt);
                    }
                }

                // 4. 全量預加載各次段考，以利即時分析
                await preloadAllExams();
                onFilterChange();

            } catch (err) {
                alert("❌ 無法讀取主控總表，請確認該 Google 試算表具備『知道連結的人皆可查看』權限。");
            } finally {
                document.getElementById("global-loader").classList.add("hidden");
            }
        }

        // 預加載所有段考以利歷史軌跡即時計算
        async function preloadAllExams() {
            for (let item of cachedMenuData) {
                const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                const url = item['該次成績單的 Google 試算表網址'];
                if (name && url && !allExamsData[name]) {
                    try {
                        const csvUrl = cleanGoogleSheetUrl(url);
                        const resp = await fetch(csvUrl);
                        const txt = await resp.text();
                        allExamsData[name] = processSingleExamData(txt, name);
                    } catch (e) {
                        console.error(`無法加載 ${name} 的數據`, e);
                    }
                }
            }
        }

        // 精密處理與計算單次段考的排名、PR 值數據
        function processSingleExamData(csvText, examName) {
            const rows = parseCSVText(csvText);
            const headers = rows[0];
            const rawRecords = rows.slice(1).map(row => {
                let obj = {};
                headers.forEach((h, i) => obj[h] = row[i]);
                return obj;
            });

            // 區分學生列與底層統計列
            let students = [];
            let stats = {};

            rawRecords.forEach(r => {
                const seatVal = parseInt(r['座號']);
                if (!isNaN(seatVal) && seatVal > 0) {
                    students.push(r);
                } else {
                    const nameStr = String(r['座號'] || r['姓名'] || '');
                    if (nameStr.includes('高標')) stats['高標'] = r;
                    if (nameStr.includes('平均') || nameStr.includes('均標')) stats['平均'] = r;
                }
            });

            const isGrade23 = examName.includes("二上") || examName.includes("二下") || examName.includes("三上") || examName.includes("三下");

            // 科目預處理
            students.forEach(s => {
                ['國文', '英文', '數學', '自然', '社會', '歷史', '地理', '公民'].forEach(sub => {
                    s[sub] = parseFloat(s[sub]) || 0;
                });
                s['社會_融合'] = isGrade23 ? (((s['歷史'] || 0) + (s['地理'] || 0) + (s['公民'] || 0)) / 3) : (s['社會'] || 0);
                s['總分'] = s['國文'] + s['英文'] + s['數學'] + s['自然'] + s['社會_融合'];
            });

            // 排序並計算名次 (最小排名法 method='min')
            students.forEach(s => {
                s['名次'] = 1 + students.filter(other => other['總分'] > s['總分']).length;
            });

            // 計算 fractional ranking 的 PR 值 (比照 Pandas rank(pct=True)*100 邏輯)
            const radarSubs = isGrade23 ? ['國文', '英文', '數學', '自然', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            
            students.forEach(s => {
                // 總分 PR
                let lowerTotal = students.filter(other => other['總分'] < s['總分']).length;
                let equalTotal = students.filter(other => other['總分'] === s['總分']).length;
                s['總PR'] = ((lowerTotal + 1 + (equalTotal - 1) / 2) / students.length) * 100;

                // 各科 PR
                radarSubs.forEach(sub => {
                    let lowerSub = students.filter(other => other[sub] < s[sub]).length;
                    let equalSub = students.filter(other => other[sub] === s[sub]).length;
                    s[`${sub}_PR`] = ((lowerSub + 1 + (equalSub - 1) / 2) / students.length) * 100;
                });
            });

            return { students, stats, isGrade23 };
        }

        // 篩選變更響應機制
        function onFilterChange() {
            const selectedExam = document.getElementById("exam-select").value;
            const currentSeat = sessionState.role === "teacher" ? parseInt(document.getElementById("seat-select").value) : sessionState.userId;

            const examPackage = allExamsData[selectedExam];
            if (!examPackage) {
                alert("⚠️ 此次段考數據尚未就緒或讀取失敗。");
                return;
            }

            const student = examPackage.students.find(s => parseInt(s['座號']) === currentSeat);
            if (!student) {
                document.getElementById("tab-content-1").classList.add("hidden");
                alert("⚠️ 此次考試中查無此座號成績資料。");
                return;
            }

            document.getElementById("tab-content-1").classList.remove("hidden");
            renderSingleExamView(student, examPackage);
            
            // 如果當前在歷史分頁，聯動更新
            if (!document.getElementById("tab-content-2").classList.contains("hidden")) {
                renderHistoryCharts();
            }
        }

        // 渲染單次考試數據畫面卡片與雷達圖
        function renderSingleExamView(student, examPackage) {
            const isGrade23 = examPackage.isGrade23;
            const displaySubs = isGrade23 ? ['國文', '英文', '數學', '自然', '社會', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            const radarSubs = isGrade23 ? ['國文', '英文', '數學', '自然', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];

            // 1. 填充指標大卡片
            document.getElementById("metric-total-score").innerText = student['總分'].toFixed(2);
            document.getElementById("metric-rank").innerText = `第 ${student['名次']} 名`;
            document.getElementById("metric-pr").innerText = student['總PR'].toFixed(2);

            // 2. 填充科目細項列表
            const listEl = document.getElementById("score-details-list");
            listEl.innerHTML = "";

            displaySubs.forEach(sub => {
                const score = student[sub] || 0;
                const avg = parseFloat(examPackage.stats['平均']?.[sub]) || 0;
                const high = parseFloat(examPackage.stats['高標']?.[sub]) || 0;
                
                let row = document.createElement("div");
                row.className = "flex items-center justify-between py-2 border-b border-slate-100 last:border-0";
                
                const prefix = ['歷史', '地理', '公民'].includes(sub) ? "└ " : "";
                row.innerHTML = `
                    <span class="font-bold text-slate-700">${prefix}${sub}</span>
                    <span class="font-mono text-slate-600">
                        <span class="text-indigo-600 font-bold text-base">${score.toFixed(1)}</span> 分 
                        <span class="text-slate-300 mx-1.5">|</span> 班均: ${avg.toFixed(1)} 
                        <span class="text-slate-300 mx-1.5">|</span> 高標: ${high.toFixed(1)}
                    </span>
                `;
                listEl.appendChild(row);
            });

            // 3. 渲染 Chart.js 雷達圖
            const prValues = radarSubs.map(sub => student[`${sub}_PR`] || 0);

            if (charts.radar) charts.radar.destroy();
            const ctx = document.getElementById('radarChart').getContext('2d');
            charts.radar = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: radarSubs.map(s => `${s} (PR)`),
                    datasets: [
                        {
                            label: '個人表現',
                            data: prValues,
                            backgroundColor: 'rgba(79, 129, 189, 0.25)',
                            borderColor: 'rgba(79, 129, 189, 1)',
                            borderWidth: 2,
                            pointBackgroundColor: 'rgba(79, 129, 189, 1)',
                            z: 10
                        },
                        {
                            label: 'PR 50 (中位數)',
                            data: Array(radarSubs.length).fill(50),
                            backgroundColor: 'transparent',
                            borderColor: 'rgba(192, 80, 77, 0.8)',
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            z: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0, max: 100,
                            ticks: { stepSize: 25, backdropColor: 'transparent', font: { size: 9 } },
                            grid: { color: '#e2e8f0' },
                            angleLines: { color: '#e2e8f0' },
                            pointLabels: { font: { size: 11, weight: 'bold' }, color: '#334155' }
                        }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                    }
                }
            });
        }

        // 綜合渲染歷史軌跡走勢圖 (跨學期分析)
        function renderHistoryCharts() {
            const currentSeat = sessionState.role === "teacher" ? parseInt(document.getElementById("seat-select").value) : sessionState.userId;
            
            // 撈取全量段考歷史清單
            let examLabels = [];
            let subHistory = { '國文': [], '英文': [], '數學': [], '自然': [], '社會': [] };
            let rankHistory = [];

            cachedMenuData.forEach(item => {
                const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                const pkg = allExamsData[name];
                if (pkg) {
                    const stud = pkg.students.find(s => parseInt(s['座號']) === currentSeat);
                    if (stud) {
                        examLabels.push(name);
                        rankHistory.push(stud['名次']);
                        
                        // 計算展示用的社會 PR (融合或獨立)
                        const socPr = pkg.isGrade23 ? stud['社會_融合_PR'] : stud['社會_PR'];
                        
                        subHistory['國文'].push(stud['國文_PR'] || 0);
                        subHistory['英文'].push(stud['英文_PR'] || 0);
                        subHistory['數學'].push(stud['數學_PR'] || 0);
                        subHistory['自然'].push(stud['自然_PR'] || 0);
                        subHistory['社會'].push(socPr || 0);
                    }
                }
            });

            // 1. 各科 PR 走勢折線圖
            if (charts.historyPr) charts.historyPr.destroy();
            const ctxPr = document.getElementById('historyPrChart').getContext('2d');
            charts.historyPr = new Chart(ctxPr, {
                type: 'line',
                data: {
                    labels: examLabels,
                    datasets: [
                        { label: '國文 PR', data: subHistory['國文'], borderColor: '#4f81bd', tension: 0.15, fill: false, borderWidth: 2.5 },
                        { label: '英文 PR', data: subHistory['英文'], borderColor: '#c0504d', tension: 0.15, fill: false, borderWidth: 2.5 },
                        { label: '數學 PR', data: subHistory['數學'], borderColor: '#9bbb59', tension: 0.15, fill: false, borderWidth: 2.5 },
                        { label: '自然 PR', data: subHistory['自然'], borderColor: '#8064a2', tension: 0.15, fill: false, borderWidth: 2.5 },
                        { label: '社會 PR', data: subHistory['社會'], borderColor: '#4bacc6', tension: 0.15, fill: false, borderWidth: 2.5 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 0, max: 100, title: { display: true, text: 'PR 值 (越大越優異)', font: { weight: 'bold' } } },
                        x: { ticks: { maxRotation: 15 } }
                    },
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } }
                }
            });

            // 2. 班級名次晉升圖 (Y 軸必須顛倒反轉！)
            if (charts.historyRank) charts.historyRank.destroy();
            const ctxRank = document.getElementById('historyRankChart').getContext('2d');
            
            const maxRankFound = Math.max(...rankHistory, 30);

            charts.historyRank = new Chart(ctxRank, {
                type: 'line',
                data: {
                    labels: examLabels,
                    datasets: [{
                        label: '班級名次',
                        data: rankHistory,
                        borderColor: '#E67E22',
                        backgroundColor: 'rgba(230, 126, 34, 0.1)',
                        tension: 0.1,
                        fill: true,
                        borderWidth: 3,
                        pointRadius: 4,
                        pointBackgroundColor: '#E67E22'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            reverse: true, // 顛倒關鍵設定！名次第 1 名要在最上面
                            min: 1,
                            max: maxRankFound + 2,
                            title: { display: true, text: '名次 (越高代表越進步)', font: { weight: 'bold' } },
                            ticks: { stepSize: 5 }
                        },
                        x: { ticks: { maxRotation: 15 } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
