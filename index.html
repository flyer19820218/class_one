<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>801 專屬成績大數據主控台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        .chart-container { position: relative; width: 100%; height: 320px; }
        @media (max-width: 640px) { .chart-container { height: 260px; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="login-section" class="flex items-center justify-center min-h-screen px-4 py-8">
        <div class="bg-white p-7 sm:p-8 rounded-3xl shadow-xl max-w-sm w-full border border-slate-100 animate-fade-in">
            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl text-2xl mb-4">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 class="text-xl font-black text-slate-900">801 成績主控台</h2>
                <p class="text-slate-500 text-xs mt-1 px-4 font-medium">使用導師密碼或身份證字號登入</p>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-3 gap-2">
                    <label class="flex items-center justify-center py-2.5 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 text-xs font-bold transition">
                        <input type="radio" name="role" value="student" checked class="sr-only" onchange="toggleRoleInput()"> 學生
                    </label>
                    <label class="flex items-center justify-center py-2.5 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 text-xs font-bold transition">
                        <input type="radio" name="role" value="parent" class="sr-only" onchange="toggleRoleInput()"> 家長
                    </label>
                    <label class="flex items-center justify-center py-2.5 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 text-xs font-bold transition">
                        <input type="radio" name="role" value="teacher" class="sr-only" onchange="toggleRoleInput()"> 導師
                    </label>
                </div>

                <div>
                    <label id="username-label" class="block text-xs font-bold text-slate-400 mb-1.5 ml-1">座號：</label>
                    <input type="text" id="username" placeholder="例如：5" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 ml-1">身份證字號：</label>
                    <input type="password" id="password" placeholder="請注意大寫字母" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm font-medium">
                </div>

                <button onclick="handleLogin()" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/10 text-sm mt-2 flex items-center justify-center gap-2">
                    <span>🚀 登入系統</span>
                </button>
                <p id="login-error" class="text-red-500 text-xs text-center hidden font-bold"></p>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-4xl mx-auto px-3 py-4 sm:px-4 sm:py-6 animate-fade-in">
        <header class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-3 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center text-lg shadow-md shadow-indigo-600/20">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-black text-slate-900 leading-tight">801 專屬成績主控台</h1>
                    <p id="user-badge-text" class="text-slate-400 text-[10px] sm:text-xs font-medium">載入中...</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-slate-300 hover:text-red-500 transition p-2 text-xl">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </header>

        <div class="flex bg-slate-200/50 p-1 rounded-xl mb-4 gap-1">
            <button id="tab-btn-1" onclick="switchTab(1)" class="flex-1 py-2.5 rounded-lg font-bold text-xs transition bg-white shadow-sm text-indigo-600">
                <i class="fa-solid fa-magnifying-glass mr-1.5"></i> 單次成績報告
            </button>
            <button id="tab-btn-2" onclick="switchTab(2)" class="flex-1 py-2.5 rounded-lg font-bold text-xs transition text-slate-500">
                <i class="fa-solid fa-chart-line mr-1.5"></i> 跨學期分析
            </button>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3 mb-4">
            <div id="teacher-seat-picker" class="hidden border-b border-slate-50 pb-3">
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1">🔢 選擇查詢座號：</label>
                <select id="seat-select" onchange="onFilterChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700"></select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1">📅 選擇考試項目：</label>
                <select id="exam-select" onchange="onFilterChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700"></select>
            </div>
        </div>

        <div id="global-loader" class="text-center py-10 hidden">
            <div class="inline-block animate-spin rounded-full h-6 w-6 border-4 border-indigo-600 border-t-transparent mb-2"></div>
            <p class="text-slate-400 text-xs font-medium">大數據分析中...</p>
        </div>

        <div id="tab-content-1" class="hidden space-y-4">
            <div class="grid grid-cols-3 gap-2 sm:gap-3">
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-[9px] font-bold text-slate-400 mb-0.5 uppercase tracking-wider">五科總分</p>
                    <p id="metric-total-score" class="text-lg font-black text-indigo-600">--</p>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-[9px] font-bold text-slate-400 mb-0.5 uppercase tracking-wider">班級名次</p>
                    <p id="metric-rank" class="text-lg font-black text-slate-800">--</p>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-[9px] font-bold text-slate-400 mb-0.5 uppercase tracking-wider">總 PR 值</p>
                    <p id="metric-pr" class="text-lg font-black text-emerald-600">--</p>
                </div>
            </div>

            <div class="flex flex-col lg:flex-row gap-4">
                <div class="flex-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-900 mb-4"><i class="fa-solid fa-list-check text-indigo-500 mr-2"></i>成績明細與指標</h3>
                    <div id="score-details-list" class="space-y-1.5 text-xs font-medium text-slate-600">
                        </div>
                </div>
                <div class="flex-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
                    <h3 class="text-sm font-bold text-slate-900 mb-4 self-start"><i class="fa-solid fa-bullseye text-indigo-500 mr-2"></i>能力核心 (完全複製 Matplotlib 風格)</h3>
                    <div class="w-full max-w-[300px] aspect-square relative">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-content-2" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-bold text-slate-900 mb-3 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-indigo-500 rounded-full"></div> 一年級真實 PR 軌跡
                </h3>
                <div class="chart-container"><canvas id="historyPrChart1"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-bold text-slate-900 mb-3 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div> 二年級真實 PR 軌跡 (融合邏輯對應)
                </h3>
                <div class="chart-container"><canvas id="historyPrChart2"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-bold text-orange-500 mb-3 flex items-center gap-2 uppercase tracking-wider">
                    <i class="fa-solid fa-arrow-trend-up"></i> 🏆 班級名次晉升軌跡 (跨學年數據反轉)
                </h3>
                <div class="chart-container"><canvas id="historyRankChart"></canvas></div>
            </div>
        </div>
    </div>

    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script>
        // 配置區：填入老師的 Google Apps Script 與 總表網址
        const API_URL = "https://script.google.com/macros/s/AKfycbyEIoXhHnX3S-JQw_CQp4eWFsbPGsKkHFBsCg9xVsW499n2MgXJaHvpiyV9XYtsECzsaA/exec";
        const MASTER_MENU_URL = "https://docs.google.com/spreadsheets/d/1FL-orK8H_oDrLuDg1pAijJICjHzPxJLcPIEngF0wko8/export?format=csv&gid=0";

        // 全局狀態暫存
        let sessionState = { loggedIn: false, role: null, userId: null };
        let cachedMenuData = [];
        let allExamsData = {}; // 快取所有讀取過的考試數據
        let charts = { radar: null, h1: null, h2: null, h3: null, rank: null };

        // 身分選擇 UI 調整
        function toggleRoleInput() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const label = document.getElementById("username-label");
            const input = document.getElementById("username");
            if (role === "teacher") { label.innerText = "導師帳號："; input.placeholder = "請輸入導師帳號"; }
            else { label.innerText = "座號："; input.placeholder = "例如：5"; }
        }

        // 登入驗證處理
        async function handleLogin() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const userId = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorEl = document.getElementById("login-error");
            const btn = document.getElementById("login-btn");

            errorEl.classList.add("hidden");
            if (!userId || !password) { errorEl.innerText = "❌ 帳號與密碼欄位不能為空！"; errorEl.classList.remove("hidden"); return; }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>正在精密驗證中...</span>`;

            try {
                // 發出驗證請求給守門員 (Apps Script)
                const resp = await fetch(`${API_URL}?role=${role}&userId=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`);
                const result = await resp.json();

                if (result.status === "success") {
                    sessionState.loggedIn = true;
                    sessionState.role = result.role;
                    sessionState.userId = role === "teacher" ? "yen" : parseInt(userId);
                    
                    document.getElementById("login-section").classList.add("hidden");
                    document.getElementById("dashboard-section").classList.remove("hidden");
                    
                    initDashboard();
                } else {
                    errorEl.innerText = "❌ " + result.message;
                    errorEl.classList.remove("hidden");
                }
            } catch (err) {
                errorEl.innerText = "❌ 無法連線至驗證伺服器，請確認網路環境或 VPN。";
                errorEl.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>🚀 登入系統</span>`;
            }
        }

        // 登出與重整
        function handleLogout() { location.reload(); }

        // 分頁切換 (手機版優化)
        function switchTab(tabNum) {
            const t1Btn = document.getElementById("tab-btn-1");
            const t2Btn = document.getElementById("tab-btn-2");
            const t1Content = document.getElementById("tab-content-1");
            const t2Content = document.getElementById("tab-content-2");

            if (tabNum === 1) {
                t1Btn.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition bg-white shadow-sm text-indigo-600";
                t2Btn.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition text-slate-500";
                t1Content.classList.remove("hidden"); t2Content.classList.add("hidden");
            } else {
                t2Btn.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition bg-white shadow-sm text-indigo-600";
                t1Btn.className = "flex-1 py-2.5 rounded-lg font-bold text-xs transition text-slate-500";
                t2Content.classList.remove("hidden"); t1Content.classList.add("hidden");
                renderHistoryCharts(); // 點擊歷程分頁才繪製圖表
            }
        }

        // 轉換 Google Sheet 網址為 CSV 下載網址
        function cleanGoogleSheetUrl(url) {
            if (url.includes("export?format=csv")) return url;
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match) {
                const gidMatch = url.match(/gid=([0-9]+)/);
                const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : "";
                return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv${gidParam}`;
            }
            return url;
        }

        // 解析 CSV 文字演算法 ( Fractional Ranking )
        function parseCSVText(text) {
            const lines = text.split(/\r?\n/);
            return lines.map(line => {
                let result = [], current = '', inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                    else { current += char; }
                }
                result.push(current.trim()); return result;
            }).filter(row => row.length > 0 && row.some(cell => cell !== ""));
        }

        // 初始化主控面板
        async function initDashboard() {
            document.getElementById("global-loader").classList.remove("hidden");
            const badgeText = sessionState.role === "teacher" ? "導師主控模式 (yen)" : `801班 座號${sessionState.userId} 成績報告`;
            document.getElementById("user-badge-text").innerText = badgeText;

            try {
                // 1. 讀取總表
                const resp = await fetch(MASTER_MENU_URL);
                const csvText = await resp.text();
                const rows = parseCSVText(csvText);
                
                const headers = rows[0];
                cachedMenuData = rows.slice(1).map(row => {
                    let obj = {}; headers.forEach((h, i) => obj[h] = row[i]); return obj;
                });

                // 2. 填充段考下拉選單
                const examSelect = document.getElementById("exam-select");
                examSelect.innerHTML = "";
                cachedMenuData.forEach(item => {
                    const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                    if (name) { let opt = document.createElement("option"); opt.value = name; opt.innerText = name; examSelect.appendChild(opt); }
                });

                // 3. 填充導師座號選單
                if (sessionState.role === "teacher") {
                    document.getElementById("teacher-seat-picker").classList.remove("hidden");
                    const seatSelect = document.getElementById("seat-select");
                    seatSelect.innerHTML = "";
                    for (let i = 1; i <= 31; i++) {
                        let opt = document.createElement("option"); opt.value = i; opt.innerText = `${i} 號學生`; seatSelect.appendChild(opt);
                    }
                }

                // 4. 預加載所有考試數據 ( Fractional Ranking 即時計算)
                await preloadAllExams();
                onFilterChange();

            } catch (err) { alert("無資料，連結 People of  know of can look at"); }
            finally { document.getElementById("global-loader").classList.add("hidden"); }
        }

        // 預加載所有考試數據
        async function preloadAllExams() {
            for (let item of cachedMenuData) {
                const name = item['考試檔案名稱或別名'] || item['考試名稱'];
                const url = item['該次成績單的 Google 試算表網址'];
                if (name && url && !allExamsData[name]) {
                    try {
                        const csvUrl = cleanGoogleSheetUrl(url);
                        const resp = await fetch(csvUrl);
                        const txt = await resp.text();
                        allExamsData[name] = processSingleExamData(txt, name);
                    } catch (e) {}
                }
            }
        }

        // 精密處理與計算 Fractional Ranking PR 值數據
        function processSingleExamData(csvText, examName) {
            const rows = parseCSVText(csvText);
            const headers = rows[0];
            const rawRecords = rows.slice(1).map(row => {
                let obj = {}; headers.forEach((h, i) => obj[h] = row[i]); return obj;
            });

            let students = [], stats = {};
            rawRecords.forEach(r => {
                const seatVal = parseInt(r['座號']);
                if (!isNaN(seatVal) && seatVal > 0) students.push(r);
                else {
                    const nameStr = String(r['座號'] || r['姓名'] || '');
                    if (nameStr.includes('高標')) stats['高標'] = r;
                    if (nameStr.includes('平均') || nameStr.includes('均標')) stats['平均'] = r;
                }
            });

            // 科目預處理
            const isGrade23 = examName.includes("二") || examName.includes("三");
            students.forEach(s => {
                ['國文', '英文', '數學', '自然', '社會', '歷史', '地理', '公民'].forEach(sub => s[sub] = parseFloat(s[sub]) || 0);
                s['社會_融合'] = isGrade23 ? (((s['歷史'] || 0) + (s['地理'] || 0) + (s['公民'] || 0)) / 3) : (s['社會'] || 0);
                s['總分'] = s['國文'] + s['英文'] + s['數學'] + s['自然'] + s['社會_融合'];
            });

            // 計算名次 ( Fractional Ranking 最小排名法 )
            students.forEach(s => s['名次'] = 1 + students.filter(other => other['總分'] > s['總分']).length);

            // 計算 fractional ranking 的 PR 值 (Pandas 核心演算法 Fractional Ranking)
            const radarSubs = isGrade23 ? ['國文', '英文', '數學', '自然', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            students.forEach(s => {
                let lowerT = students.filter(other => other['總分'] < s['總分']).length, equalT = students.filter(other => other['總分'] === s['總分']).length;
                s['總PR'] = ((lowerT + 1 + (equalT - 1) / 2) / students.length) * 100;
                radarSubs.forEach(sub => {
                    let lowerS = students.filter(other => other[sub] < s[sub]).length, equalS = students.filter(other => other[sub] === s[sub]).length;
                    s[`${sub}_PR`] = ((lowerS + 1 + (equalS - 1) / 2) / students.length) * 100;
                });
            });

            return { students, stats, isGrade23 };
        }

        // 篩選變更響應機制
        function onFilterChange() {
            const selectedExam = document.getElementById("exam-select").value;
            const currentSeat = sessionState.role === "teacher" ? parseInt(document.getElementById("seat-select").value) : sessionState.userId;
            const examPackage = allExamsData[selectedExam];
            if (!examPackage) return;
            const student = examPackage.students.find(s => parseInt(s['座號']) === currentSeat);
            if (!student) { document.getElementById("tab-content-1").classList.add("hidden"); return; }
            document.getElementById("tab-content-1").classList.remove("hidden");
            renderSingleExamView(student, examPackage);
            if (!document.getElementById("tab-content-2").classList.contains("hidden")) renderHistoryCharts();
        }

        // 渲染單次考試數據畫面 (Matplotlib 美化化)
        function renderSingleExamView(student, examPackage) {
            document.getElementById("metric-total-score").innerText = student['總分'].toFixed(1);
            document.getElementById("metric-rank").innerText = `第 ${student['名次']} 名`;
            document.getElementById("metric-pr").innerText = student['總PR'].toFixed(1);

            // 填充科目細項明細 (加回高標功能)
            const listEl = document.getElementById("score-details-list"); listEl.innerHTML = "";
            const isGrade23 = examPackage.isGrade23;
            const displaySubs = isGrade23 ? ['國文', '英文', '數學', '自然', '社會', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            displaySubs.forEach(sub => {
                const score = student[sub] || 0, avg = parseFloat(examPackage.stats['平均']?.[sub]) || 0, high = parseFloat(examPackage.stats['高標']?.[sub]) || 0;
                let row = document.createElement("div"); row.className = "flex items-center justify-between py-1.5 border-b border-slate-50 last:border-0";
                const prefix = ['歷史', '地理', '公民'].includes(sub) ? "└ " : "";
                row.innerHTML = `<span>${prefix}${sub}</span><span class="font-mono text-slate-500"><span class="text-indigo-600 font-bold">${score.toFixed(1)}</span> <span class="text-slate-300 text-[10px]">/ 均:${avg.toFixed(1)} / 高:${high.toFixed(1)}</span></span>`;
                listEl.appendChild(row);
            });

            // 繪製終極 Matplotlib 風格雷達圖
            const radarSubs = isGrade23 ? ['國文', '英文', '數學', '自然', '歷史', '地理', '公民'] : ['國文', '英文', '數學', '自然', '社會'];
            const prValues = radarSubs.map(sub => student[`${sub}_PR`] || 0);

            if (charts.radar) charts.radar.destroy();
            const ctx = document.getElementById('radarChart').getContext('2d');
            charts.radar = new Chart(ctx, {
                type: 'radar',
                data: {
